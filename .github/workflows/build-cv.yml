name: Build CV

on:
  push:
    branches: [main]
    paths:
      - cv.html
      - build-cv.sh
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-noto-core
          fc-cache -f

      - name: Render cv.pdf
        run: ./build-cv.sh

      - name: Commit cv.pdf if changed
        run: |
          if [ -z "$(git status --porcelain -- cv.pdf)" ]; then
            echo "cv.pdf is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Rebuild cv.pdf from cv.html"
          git push
